[pytest]
# Testes da esteira em paralelo (pytest-xdist, `sudo apt install python3-pytest-xdist`): `-n auto`
# vira ESTEIRA_JOBS workers (padrão 10; conftest.py). `--dist loadfile`: cada arquivo num worker
# só (fixtures de módulo, como o savestate em cache do test_battle_recovery, são geradas uma vez).
# Para rodar num processo só: `python3 -m pytest test -n 0`.
addopts = -n auto --dist loadfile
